# 与后端 docker-compose.yaml（name: exchangeapp-backend）同机：网络一般为 exchangeapp-backend_default
# 先保证后端已 up：cd Exchangeapp_backend && docker compose up -d
# 再启动前端：cd Exchangeapp_frontend && docker compose -f docker-compose.frontend.yaml up -d --build
#
# 容器名：exchangeapp-frontend（本文件） / exchangeapp-backend（后端 app 服务）
# Nginx 反代使用 compose 服务名 app:3000（不是 container_name）
#
# 若 docker network ls 里 default 网不叫 exchangeapp-backend_default，把下方 external.name 改成实际名字

name: exchangeapp-frontend

services:
  frontend:
    build:
      context: .
      args:
        API_UPSTREAM: http://app:3000
    image: exchangeapp-frontend:prod
    container_name: exchangeapp-frontend
    ports:
      - "8080:80"
    networks:
      - exchangeapp-backend-net

networks:
  exchangeapp-backend-net:
    external: true
    name: exchangeapp-backend_default
